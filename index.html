<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <table class="table">
            <tr class="table__row table__row--one">
                <td colspan="2" 
                    class="table__cell" 
                    data-type="column--1"
                ></td>
                <td colspan="3" class="table__cell"></td>
                <td colspan="2" class="table__cell table__cell--yellow"></td>
                <td rowspan="4" class="table__cell" data-type="column--8"></td>
            </tr>
            <tr class="table__row table__row--two">
                <td class="table__cell" 
                    data-type="column--1"
                ></td>
                <td colspan="4" rowspan="2" class="table__cell table__cell--red"></td>
                <td colspan="2" class="table__cell table__cell--yellow"></td>
            </tr>
            <tr class="table__row table__row--three">
                <td rowspan="2" 
                    data-type="column--1"class="table__cell"
                > </td>
                <td class="table__cell"></td>
                <td class="table__cell"></td>
            </tr>
            <tr class="table__row table__row--four">
                <td colspan="2" 
                    rowspan="2" 
                    class="table__cell table__cell--black"
                ></td>
                <!-- <td class="table__cell"></td> -->
                <td colspan="2" class="table__cell"></td>
                <td colspan="2" class="table__cell"></td>
            </tr>
            <tr class="table__row table__row--five">
                <td rowspan="3" 
                    data-type="column--1" 
                    class="table__cell table__cell--yellow"
                ></td>
                <!-- <td class="table__cell"></td> -->
                <td colspan="2" class="table__cell"></td>
                <td colspan="2" rowspan="2" class="table__cell table__cell--blue"></td>

                <td rowspan="3" data-type="column--8" class="table__cell table__cell--red"></td>
            </tr>
            <tr class="table__row table__row--six">
                <td colspan="2" 
                    class="table__cell"
                ></td>
                <td colspan="2" class="table__cell table__cell--black"></td>
            </tr>
            <tr class="table__row table__row--seven">
                <td colspan="2" 
                    class="table__cell"
                ></td>
                <td colspan="4" class="table__cell"></td>
            </tr>
            
        </table>
    </div>

</body>
</html>
